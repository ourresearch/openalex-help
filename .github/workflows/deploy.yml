name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      # Full history: the article-foot "Last updated" date is read from git
      # (src/lib/updated.ts). At the default fetch-depth of 1 every file looks
      # like it was written on deploy day.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: a452eddbbe06eb7d02f4879cee70d29c
          command: pages deploy dist --project-name=openalex-help --branch=main
